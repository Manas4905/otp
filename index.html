<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP Generator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            d="m20.42 6.11-7.97-4c-.28-.14-.62-.14-.9 0l-7.97 4c-.31.15-.51.45-.55.79-.01.11-.96 10.76 8.55 15.01a.98.98 0 0 0 .82 0C21.91 17.66 20.97 7 20.95 6.9a.98.98 0 0 0-.55-.79ZM12 19.9C5.26 16.63 4.94 9.64 5 7.64l7-3.51 7 3.51c.04 1.99-.33 9.02-7 12.26"
          ></path>
          <path
            d="m11 12.59-1.29-1.3-1.42 1.42 2.71 2.7 4.71-4.7-1.42-1.42z"
          ></path>
        </svg>
      </header>
      <h4>OTP Generator</h4>
      <div class="otp-box" aria-live="polite" aria-atomic="true">
        <span id="otpValue">------</span>
      </div>
      <div id="generateArea">
        <button id="generateBtn" type="button">Generate OTP</button>
        <div
          id="generateCountdown"
          class="countdown"
          aria-live="polite"
          hidden
        ></div>
      </div>
      <form id="otpForm" autocomplete="off">
        <input
          id="otpInput"
          name="otp"
          type="text"
          inputmode="numeric"
          pattern="\d{6}"
          maxlength="6"
          placeholder="Enter 6-digit OTP"
          aria-describedby="statusMessage"
        />
        <button id="verifyBtn" type="submit" disabled>Verify OTP</button>
      </form>
      <p id="expiryTimer" class="expiry" aria-live="polite"></p>
      <p id="statusMessage" class="status" role="status"></p>
    </div>
    <div id="noticeOverlay" class="notice-overlay" hidden>
      <div
        id="noticeBox"
        class="notice"
        role="dialog"
        aria-modal="true"
        aria-live="polite"
      >
        <p id="noticeText"></p>
        <button id="noticeAction" type="button"></button>
      </div>
    </div>
  </body>
</html>
